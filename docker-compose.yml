services:
  mongodb:
    image: mongo:latest
    container_name: recruitment-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: recruitment-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://admin:secret123@mongodb:27017/recruitment?authSource=admin
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./api/uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: recruitment-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  monitor:
    build:
      context: ./services/1_monitor
    container_name: recruitment-monitor
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://admin:secret123@mongodb:27017/recruitment?authSource=admin
      POLL_INTERVAL_SECONDS: 5
      TEXT_SERVICE_URL: http://text:8080
      RAG_SERVICE_URL: http://rag:8080
      EMBEDDINGS_SERVICE_URL: http://embeddings:8080
      MATCHING_SERVICE_URL: http://matching:8080

  text:
    build:
      context: ./services/2_text
    container_name: recruitment-text
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://admin:secret123@mongodb:27017/recruitment?authSource=admin
    volumes:
      - ./api/uploads:/app/uploads

  rag:
    build:
      context: ./services/3_rag
    container_name: recruitment-rag
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://admin:secret123@mongodb:27017/recruitment?authSource=admin
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ONET_API_KEY: ${ONET_API_KEY:-}

  embeddings:
    build:
      context: ./services/4_embeddings
    container_name: recruitment-embeddings
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://admin:secret123@mongodb:27017/recruitment?authSource=admin
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  matching:
    build:
      context: ./services/5_matching
    container_name: recruitment-matching
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://admin:secret123@mongodb:27017/recruitment?authSource=admin

volumes:
  mongo-data:
